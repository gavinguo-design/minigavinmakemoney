name: Freeze daily published analysis
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['investment/chart/annotations.json', 'scripts/archive-analysis.cjs', '.github/workflows/archive-analysis.yml']
  schedule:
    # 16:45 HKT each weekday. HKEX calendar checked inside the script.
    - cron: '45 8 * * 1-5'
permissions:
  contents: write
concurrency:
  group: daily-analysis-archive
  cancel-in-progress: false
jobs:
  freeze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Freeze actual published analysis and check provenance
        run: |
          node --test tests/archive-analysis.cjs
          node scripts/archive-analysis.cjs
      - name: Commit archive without rewriting snapshots
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add investment/chart/archive
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Freeze published analysis for $(TZ=Asia/Hong_Kong date +%F)"
          git pull --rebase origin main
          git push origin HEAD:main
