name: Generate and review daily HSI analysis
on:
  workflow_dispatch:
    inputs:
      phase:
        type: choice
        options: [preopen, postclose]
        default: preopen
  push:
    branches: [main]
    paths: ['scripts/daily-analysis.cjs', 'scripts/publish-daily-analysis.cjs', 'scripts/score-performance.cjs', 'scripts/weights-v3.cjs', 'scripts/v4-weights.cjs', 'scripts/v4-preopen-data.cjs', 'research/v4/model-v4.json', 'scripts/check-daily-publication.cjs', 'tests/**', 'investment/chart/index.html', 'investment/chart/track/**', 'investment/chart/market-rules.js', '.github/workflows/daily-analysis.yml']
  schedule:
    # HKT 08:45 generation and 16:20 close review; script checks HKEX calendar.
    - cron: '45 0 * * 1-5'
    - cron: '5 1 * * 1-5'
    - cron: '20,40 8 * * 1-5'
permissions:
  contents: write
concurrency:
  group: daily-analysis-publication
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test tests/*.cjs
      # Connectivity probe for rule-weights-v4 overnight inputs from a GitHub runner (read-only; never publishes).
      # Non-blocking: production preopen falls back to v3 with an annotation if these are unavailable at 08:45.
      - name: Probe v4 overnight inputs (Yahoo)
        continue-on-error: true
        run: node scripts/v4-preopen-data.cjs | head -c 4000
  publish:
    needs: verify
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate generator contract
        run: node --test tests/*.cjs
      - name: Generate or confirm completed close
        env:
          PHASE: ${{ inputs.phase || (github.event.schedule == '20,40 8 * * 1-5' && 'postclose' || 'preopen') }}
        run: node scripts/publish-daily-analysis.cjs "$PHASE"
      - name: Publish generated analysis
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add investment/chart/annotations.json investment/chart/scenario_status.json investment/chart/kline_futu.json investment/chart/daily-generated investment/chart/daily-reviews
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Publish daily HSI analysis or close review"
          git pull --rebase origin main
          git push origin HEAD:main
      # Bot commits do not trigger another Actions workflow. Recompute explicitly
      # after the forecast/review commit exists so publication evidence is verifiable.
      - name: Refresh forward performance ledger
        run: |
          git pull --rebase origin main
          node scripts/score-performance.cjs
          git add investment/chart/predictions/performance.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Refresh forward prediction scorecard"
          git push origin HEAD:main
