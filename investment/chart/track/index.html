<!DOCTYPE html>
<html lang="zh" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>预测战绩 · miniGG 恒指</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet" />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg: #080c10; --card: #0e1419; --border: #1a2030;
      --up: #00d87f; --down: #ff4466; --gold: #f5c842;
      --text: #e2e8f0; --muted: #64748b;
    }
    html, body { background: var(--bg); color: var(--text); font-family: 'Inter', system-ui, sans-serif; }
    .mono { font-family: 'JetBrains Mono', monospace; }
    .wrap { max-width: 900px; margin: 0 auto; padding: 0 14px 40px; }

    header {
      position: sticky; top: 0; z-index: 50;
      background: rgba(8,12,16,0.85); backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--border);
      padding: 12px 16px; display: flex; align-items: center; gap: 10px;
    }
    .logo { width: 26px; height: 26px; border-radius: 6px; background: linear-gradient(135deg, #00d87f, #3b82f6);
      display: flex; align-items: center; justify-content: center; color: #000; font-size: 12px; font-weight: 900; }
    header b { font-weight: 800; }
    header a { color: var(--muted); font-size: 12px; text-decoration: none; }
    header a:hover { color: var(--text); }

    h1 { font-size: 18px; font-weight: 800; margin: 18px 4px 4px; }
    .sub { font-size: 12px; color: var(--muted); margin: 0 4px 16px; line-height: 1.6; }

    /* stats */
    .stats { display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; margin-bottom: 18px; }
    @media (max-width: 720px) { .stats { grid-template-columns: repeat(2, 1fr); } }
    .stat { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 12px; text-align: center; }
    .stat .v { font-size: 18px; font-weight: 800; font-family: 'JetBrains Mono', monospace; color: var(--muted); }
    .stat .k { font-size: 10.5px; color: var(--muted); margin-top: 4px; line-height: 1.4; }
    .stats-note { font-size: 11.5px; color: var(--gold); background: rgba(245,200,66,0.08);
      border: 1px solid rgba(245,200,66,0.25); border-radius: 10px; padding: 8px 12px; margin-bottom: 18px; }

    /* prediction card */
    .pred { background: var(--card); border: 1px solid var(--border); border-radius: 14px; padding: 16px; margin-bottom: 14px; }
    .p-head { display: flex; align-items: center; flex-wrap: wrap; gap: 8px; margin-bottom: 10px; }
    .p-id { font-size: 11px; color: var(--muted); font-family: 'JetBrains Mono', monospace; }
    .p-status { font-size: 11px; font-weight: 700; padding: 3px 10px; border-radius: 999px; margin-left: auto; }
    .p-status.pending { color: var(--gold); background: rgba(245,200,66,0.1); border: 1px solid rgba(245,200,66,0.3); }
    .p-status.hit { color: var(--up); background: rgba(0,216,127,0.1); border: 1px solid rgba(0,216,127,0.3); }
    .p-status.miss { color: var(--down); background: rgba(255,68,102,0.1); border: 1px solid rgba(255,68,102,0.3); }
    .p-base { font-size: 13px; margin-bottom: 8px; }
    .p-base b { font-family: 'JetBrains Mono', monospace; }
    .p-bias { font-size: 12px; color: #cbd5e1; margin-bottom: 10px; }
    .p-sect { font-size: 11px; font-weight: 700; color: #94a3b8; margin: 10px 0 5px; text-transform: uppercase; letter-spacing: 0.05em; }
    .p-row { font-size: 12px; color: #94a3b8; line-height: 1.6; padding: 6px 10px; background: rgba(255,255,255,0.02);
      border: 1px solid var(--border); border-radius: 8px; margin-bottom: 5px; }
    .p-row b { color: #cbd5e1; }
    .p-row .prob { font-family: 'JetBrains Mono', monospace; font-weight: 700; }
    .p-digest { font-size: 11.5px; color: var(--muted); line-height: 1.6; margin-top: 8px; }
    .p-outcome { margin-top: 10px; font-size: 12px; color: #cbd5e1; line-height: 1.6;
      border-top: 1px dashed var(--border); padding-top: 10px; }
    footer { margin-top: 26px; text-align: center; font-size: 11px; color: #475569; line-height: 1.8; }
    footer a { color: var(--muted); }
  </style>
</head>
<body>
  <header>
    <div class="logo">M</div>
    <b>miniGG · 预测战绩</b>
    <a href="../">← 返回K线分析</a>
  </header>

  <div class="wrap">
    <h1>恒指预测战绩 · 给每个预测留尸体</h1>
    <p class="sub">每条预测发布时完整冻结快照（当时价格 / 结论 / 条件 / 失效位），到期结算真实结果，不删不改。<br/>结算规则：有效期结束后对照真实走势记录命中情景、MFE/MAE。未到期显示「进行中」。</p>

    <div class="stats" id="statsGrid">
      <div class="stat"><div class="v" id="stTotal">--</div><div class="k">总预测数</div></div>
      <div class="stat"><div class="v" id="stDir">--</div><div class="k">方向命中率</div></div>
      <div class="stat"><div class="v" id="stCond">--</div><div class="k">条件触发后命中率</div></div>
      <div class="stat"><div class="v" id="stMfeMae">--</div><div class="k">平均MFE / MAE</div></div>
      <div class="stat"><div class="v" id="stRR">--</div><div class="k">盈亏比</div></div>
    </div>
    <div class="stats-note" id="statsNote">加载中…</div>

    <div id="predList"><div class="p-row">加载预测记录…</div></div>

    <footer>
      预测为技术面推演，非投资建议 · 概率为模型主观估计，非统计值<br/>
      <a href="/">minigavin · 投资雷达</a> · <a href="../">恒指K线分析</a>
    </footer>
  </div>

<script>
(function () {
  'use strict';
  function el(id) { return document.getElementById(id); }
  function escapeHtml(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, function (ch) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[ch];
    });
  }
  function fmt(n) { return Number(n).toLocaleString('en-US'); }

  fetch('../predictions/log.json?t=' + Date.now())
    .then(function (r) { if (!r.ok) throw new Error('http ' + r.status); return r.json(); })
    .then(function (data) {
      var preds = Array.isArray(data.predictions) ? data.predictions.slice() : [];
      preds.sort(function (a, b) { return String(b.createdAt || '').localeCompare(String(a.createdAt || '')); });

      var settled = preds.filter(function (p) { return p.outcome != null; });
      var minN = (data.stats && data.stats.minSamplesForStats) || 30;

      // ---- stats：样本不足禁止编造数字 ----
      el('stTotal').textContent = String(preds.length);
      if (settled.length >= minN) {
        var dirHits = settled.filter(function (p) { return p.outcome.directionHit === true; }).length;
        el('stDir').textContent = (dirHits / settled.length * 100).toFixed(0) + '%';
        var condSample = settled.filter(function (p) {
          return Array.isArray(p.outcome.conditionTriggered) && p.outcome.conditionTriggered.length > 0;
        });
        el('stCond').textContent = condSample.length
          ? (condSample.filter(function (p) { return p.outcome.hitScenario && p.outcome.hitScenario !== 'none'; }).length / condSample.length * 100).toFixed(0) + '%'
          : '—';
        var mfes = settled.map(function (p) { return p.outcome.mfe; }).filter(function (x) { return typeof x === 'number'; });
        var maes = settled.map(function (p) { return p.outcome.mae; }).filter(function (x) { return typeof x === 'number'; });
        var avg = function (arr) { return arr.length ? arr.reduce(function (a, b) { return a + b; }, 0) / arr.length : null; };
        var avgMfe = avg(mfes), avgMae = avg(maes);
        el('stMfeMae').textContent = (avgMfe != null && avgMae != null) ? avgMfe.toFixed(0) + ' / ' + avgMae.toFixed(0) : '—';
        el('stRR').textContent = (avgMfe != null && avgMae != null && avgMae > 0) ? (avgMfe / avgMae).toFixed(2) : '—';
        el('statsNote').textContent = '统计基于 ' + settled.length + ' 条已结算预测。';
      } else {
        el('stDir').textContent = '—';
        el('stCond').textContent = '—';
        el('stMfeMae').textContent = '—';
        el('stRR').textContent = '—';
        el('statsNote').textContent = '样本积累中（已结算 ' + settled.length + '/' + minN + '）· 样本不足前不展示命中率等统计，避免小样本误导。';
      }

      // ---- prediction cards ----
      var listEl = el('predList');
      listEl.innerHTML = '';
      if (!preds.length) {
        listEl.innerHTML = '<div class="p-row">暂无预测记录。</div>';
        return;
      }
      preds.forEach(function (p) {
        var card = document.createElement('div');
        card.className = 'pred';
        var o = p.outcome;
        var statusCls, statusTxt;
        if (o == null) { statusCls = 'pending'; statusTxt = '进行中 · 有效期至 ' + escapeHtml(p.horizonEndDate || '待定'); }
        else if (o.hitScenario && o.hitScenario !== 'none') { statusCls = 'hit'; statusTxt = '已结算 · 命中：' + escapeHtml(o.hitScenario); }
        else { statusCls = 'miss'; statusTxt = '已结算 · 未命中'; }

        var scRows = (p.scenarios || []).map(function (sc) {
          return '<div class="p-row"><span class="prob">' + Math.round((sc.probability || 0) * 100) + '%</span> <b>' + escapeHtml(sc.name) + '</b><br/>' +
            '目标：' + escapeHtml(sc.target || '—') + '<br/>' +
            '触发：' + escapeHtml(sc.trigger || '—') + '<br/>' +
            '失效：<b style="color:var(--down)">' + escapeHtml(sc.invalidation || '—') + '</b></div>';
        }).join('');

        var klRows = '';
        if (p.keyLevels) {
          klRows = Object.keys(p.keyLevels).map(function (k) {
            return '<div class="p-row">' + escapeHtml(p.keyLevels[k]) + '</div>';
          }).join('');
        }

        var outcomeHtml = '';
        if (o != null) {
          outcomeHtml = '<div class="p-outcome"><b>结算结果</b>（' + escapeHtml(o.settledAt || '') + '）：' +
            '期末价 ' + (o.priceAtHorizon != null ? fmt(o.priceAtHorizon) : '—') +
            ' · 方向' + (o.directionHit ? '命中' : '未命中') +
            (typeof o.mfe === 'number' ? ' · MFE ' + fmt(o.mfe) : '') +
            (typeof o.mae === 'number' ? ' · MAE ' + fmt(o.mae) : '') +
            (o.note ? '<br/>' + escapeHtml(o.note) : '') + '</div>';
        }

        card.innerHTML =
          '<div class="p-head"><span class="p-id">' + escapeHtml(p.id) + '</span>' +
          '<span class="p-status ' + statusCls + '">' + statusTxt + '</span></div>' +
          '<div class="p-base">发布时价格 <b>' + fmt(p.basePrice) + '</b>（' + escapeHtml(p.baseDate) + ' 收盘）· 周期 ' + escapeHtml(p.horizon || '') + ' · 区间 <b>' + fmt(p.targetLower) + ' – ' + fmt(p.targetUpper) + '</b></div>' +
          '<div class="p-bias">观点：' + escapeHtml(p.biasLabel || p.bias || '') + '</div>' +
          '<div class="p-sect">条件地图（发生什么 → 看哪里）</div>' + klRows +
          '<div class="p-sect">情景与失效位</div>' + scRows +
          (p.reasoningDigest ? '<div class="p-digest">推理摘要：' + escapeHtml(p.reasoningDigest) + '</div>' : '') +
          outcomeHtml;
        listEl.appendChild(card);
      });
    })
    .catch(function (err) {
      el('predList').innerHTML = '<div class="p-row">预测记录加载失败：' + escapeHtml(err.message) + '</div>';
      el('statsNote').textContent = '数据加载失败。';
    });
})();
</script>
</body>
</html>
