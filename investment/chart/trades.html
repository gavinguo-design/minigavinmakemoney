<!DOCTYPE html>
<html lang="zh" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>交易战绩 · miniGG</title>
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet" />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    :root {
      --bg: #080c10;
      --card: #0e1419;
      --border: #1a2030;
      --up: #00d87f;      /* 绿涨（港股习惯） */
      --down: #ff4466;    /* 红跌 */
      --gold: #f5c842;
      --text: #e2e8f0;
      --muted: #64748b;
    }
    html, body { background: var(--bg); color: var(--text); font-family: 'Inter', system-ui, sans-serif; }
    .mono { font-family: 'JetBrains Mono', monospace; }
    .wrap { max-width: 900px; margin: 0 auto; padding: 0 12px 40px; }

    header {
      position: sticky; top: 0; z-index: 50;
      background: rgba(8,12,16,0.85); backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--border);
      padding: 12px 16px;
      display: flex; align-items: center; justify-content: space-between;
    }
    .brand { display: flex; align-items: center; gap: 8px; font-weight: 800; letter-spacing: -0.02em; }
    .brand .logo {
      width: 26px; height: 26px; border-radius: 6px;
      background: none; object-fit: cover;
      display: flex; align-items: center; justify-content: center;
      color: #000; font-size: 12px; font-weight: 900;
    }
    .brand a { color: var(--muted); font-size: 12px; text-decoration: none; font-weight: 500; }
    .brand a:hover { color: var(--text); }

    h1 { font-size: 20px; font-weight: 800; margin: 20px 4px 6px; letter-spacing: -0.01em; }
    .sub { font-size: 12px; color: var(--muted); margin: 0 4px 16px; }

    .up { color: var(--up); }
    .down { color: var(--down); }
    .flat { color: var(--gold); }

    /* stats bar */
    .stats {
      display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px;
      margin-bottom: 16px;
    }
    .stat {
      background: var(--card); border: 1px solid var(--border); border-radius: 12px;
      padding: 12px 10px; text-align: center;
    }
    .stat .v { font-size: 18px; font-weight: 800; font-family: 'JetBrains Mono', monospace; }
    .stat .k { font-size: 11px; color: var(--muted); margin-top: 3px; }
    @media (max-width: 560px) {
      .stats { grid-template-columns: repeat(3, 1fr); }
    }

    h2 { font-size: 16px; font-weight: 800; margin: 26px 4px 10px; color: #e2e8f0; display: flex; align-items: center; gap: 8px; letter-spacing: -0.01em; }
    h2 .cnt { font-size: 11px; color: var(--muted); font-weight: 600; }

    .trade {
      background: var(--card); border: 1px solid var(--border); border-radius: 12px;
      padding: 13px 15px; margin-bottom: 10px;
    }
    .t-top { display: flex; align-items: center; flex-wrap: wrap; gap: 6px 10px; }
    .t-sym { font-size: 15px; font-weight: 800; }
    .t-name { font-size: 12px; color: #94a3b8; }
    .t-dir {
      font-size: 10.5px; font-weight: 800; padding: 2px 8px; border-radius: 999px; border: 1px solid transparent;
    }
    .t-dir.long { color: var(--up); background: rgba(0,216,127,0.1); border-color: rgba(0,216,127,0.35); }
    .t-dir.short { color: var(--down); background: rgba(255,68,102,0.1); border-color: rgba(255,68,102,0.35); }
    .t-pnl { margin-left: auto; text-align: right; }
    .t-pnl .p { font-size: 15px; font-weight: 800; font-family: 'JetBrains Mono', monospace; }
    .t-pnl .pp { font-size: 11px; font-family: 'JetBrains Mono', monospace; }
    .t-grid {
      display: flex; flex-wrap: wrap; gap: 4px 18px; margin-top: 8px;
      font-size: 12px; color: #94a3b8;
    }
    .t-grid .lbl { color: var(--muted); font-size: 11px; }
    .t-grid .val { font-family: 'JetBrains Mono', monospace; font-weight: 600; color: #cbd5e1; }
    .t-note { margin-top: 8px; font-size: 12.5px; line-height: 1.6; color: #94a3b8; border-top: 1px dashed var(--border); padding-top: 8px; font-weight: 400; }
    .t-actions { margin-top: 10px; display: flex; gap: 8px; flex-wrap: wrap; }

    .empty {
      background: var(--card); border: 1px dashed var(--border); border-radius: 12px;
      padding: 28px 16px; text-align: center; color: var(--muted); font-size: 13px;
    }
    .loading { text-align: center; color: var(--muted); font-size: 13px; padding: 30px 0; }

    /* buttons */
    .btn {
      display: inline-flex; align-items: center; gap: 5px;
      font-size: 12px; font-weight: 700; font-family: inherit;
      padding: 7px 13px; border-radius: 9px; cursor: pointer;
      border: 1px solid var(--border); background: #131b24; color: var(--text);
      transition: border-color .15s, background .15s;
    }
    .btn:hover { border-color: #2a3550; }
    .btn.primary { background: rgba(0,216,127,0.12); border-color: rgba(0,216,127,0.4); color: var(--up); }
    .btn.danger { background: rgba(255,68,102,0.08); border-color: rgba(255,68,102,0.3); color: var(--down); }
    .btn.small { padding: 4px 10px; font-size: 11px; border-radius: 7px; }
    .btn:disabled { opacity: .5; cursor: not-allowed; }
    .toolbar { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 16px; }

    /* modal */
    .modal-mask {
      position: fixed; inset: 0; z-index: 100; display: none;
      background: rgba(0,0,0,0.6); backdrop-filter: blur(3px);
      align-items: flex-start; justify-content: center; overflow-y: auto; padding: 40px 12px;
    }
    .modal-mask.show { display: flex; }
    .modal {
      background: var(--card); border: 1px solid var(--border); border-radius: 14px;
      width: 100%; max-width: 440px; padding: 20px;
    }
    .modal h3 { font-size: 15px; font-weight: 800; margin-bottom: 14px; }
    .field { margin-bottom: 11px; }
    .field label { display: block; font-size: 11px; color: var(--muted); margin-bottom: 4px; font-weight: 600; }
    .field input, .field select, .field textarea {
      width: 100%; background: #0a1015; border: 1px solid var(--border); border-radius: 8px;
      color: var(--text); font-size: 13px; padding: 8px 10px; font-family: inherit; outline: none;
    }
    .field input:focus, .field select:focus, .field textarea:focus { border-color: #3b82f6; }
    .field textarea { resize: vertical; min-height: 54px; }
    .row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .modal-btns { display: flex; gap: 10px; justify-content: flex-end; margin-top: 16px; }
    .hint { font-size: 11px; color: var(--muted); line-height: 1.5; margin-top: 6px; }

    /* toast */
    #toast {
      position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%);
      background: #1a2436; border: 1px solid #2a3550; color: var(--text);
      padding: 10px 18px; border-radius: 10px; font-size: 13px; z-index: 200;
      display: none; max-width: 90vw; text-align: center;
    }
  </style>
</head>
<body>
  <header>
    <div class="brand">
      <img class="logo" src="/icon-192.png" alt="minigavin">
      <span>miniGG</span>
      <a href="./">← 交易地图</a>
      <a href="/">首页</a>
    </div>
    <button class="btn small" id="btnToken" title="设置 GitHub Token">⚙️</button>
  </header>

  <div class="wrap">
    <h1>📒 交易战绩</h1>
    <p class="sub">真实交易记录 · 逐笔留痕 · 开平仓价格与盈亏可查</p>

    <div class="toolbar">
      <button class="btn primary" id="btnAdd">➕ 记一笔</button>
      <button class="btn" id="btnUpload">📷 上传交割截图</button>
      <input type="file" id="fileInput" accept="image/*" style="display:none" />
    </div>

    <div id="content" class="loading">加载中…</div>
  </div>

  <!-- 记一笔 / 编辑 -->
  <div class="modal-mask" id="mTrade">
    <div class="modal">
      <h3 id="mTradeTitle">➕ 记一笔</h3>
      <div class="row2">
        <div class="field"><label>标的代码 *</label><input id="fSymbol" placeholder="如 HSI / 0700.HK" /></div>
        <div class="field"><label>名称</label><input id="fName" placeholder="如 恒指 / 腾讯" /></div>
      </div>
      <div class="row2">
        <div class="field"><label>方向</label>
          <select id="fDirection"><option value="long">做多 LONG</option><option value="short">做空 SHORT</option></select>
        </div>
        <div class="field"><label>开仓日期</label><input id="fOpenDate" type="date" /></div>
      </div>
      <div class="row2">
        <div class="field"><label>开仓价</label><input id="fOpenPrice" type="number" step="any" placeholder="如 26500" /></div>
        <div class="field"><label>数量 / 仓位</label><input id="fSize" placeholder="如 3手 / 5万 / 自由填" /></div>
      </div>
      <div class="field"><label>备注</label><textarea id="fNote" placeholder="策略、理由、止损位…"></textarea></div>
      <div class="modal-btns">
        <button class="btn" data-close>取消</button>
        <button class="btn primary" id="fSubmit">保存</button>
      </div>
    </div>
  </div>

  <!-- 平仓 -->
  <div class="modal-mask" id="mClose">
    <div class="modal">
      <h3>✅ 平仓</h3>
      <p class="hint" id="cInfo" style="margin-bottom:12px"></p>
      <div class="row2">
        <div class="field"><label>平仓日期</label><input id="cDate" type="date" /></div>
        <div class="field"><label>平仓价 *</label><input id="cPrice" type="number" step="any" /></div>
      </div>
      <div class="modal-btns">
        <button class="btn" data-close>取消</button>
        <button class="btn primary" id="cSubmit">确认平仓</button>
      </div>
    </div>
  </div>

  <!-- Token 设置 -->
  <div class="modal-mask" id="mToken">
    <div class="modal">
      <h3>⚙️ GitHub Token</h3>
      <div class="field">
        <label>Personal Access Token（需 repo 权限）</label>
        <input id="tokInput" type="password" placeholder="ghp_..." autocomplete="off" />
        <p class="hint">仓库是公开的，写入需要 GitHub token。Token 只存在本浏览器 localStorage，随请求经 HTTPS 发给站点函数代理提交，不会写入仓库代码。若已在 Cloudflare Pages 配置 GH_TOKEN 环境变量则此处可留空。</p>
      </div>
      <div class="modal-btns">
        <button class="btn danger" id="tokClear">清除</button>
        <button class="btn" data-close>取消</button>
        <button class="btn primary" id="tokSave">保存</button>
      </div>
    </div>
  </div>

  <div id="toast"></div>

  <script>
    const fmtNum = (n, d = 2) => (n === null || n === undefined || isNaN(n)) ? '--' : Number(n).toLocaleString('en-US', { minimumFractionDigits: d, maximumFractionDigits: d });
    const signed = (n, d = 2) => (n === null || n === undefined || isNaN(n)) ? '--' : (n > 0 ? '+' : '') + fmtNum(n, d);
    const cls = (n) => (n === null || n === undefined || isNaN(n)) ? 'flat' : (n > 0 ? 'up' : n < 0 ? 'down' : 'flat');
    const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
    const $ = (id) => document.getElementById(id);

    let TRADES = [];
    let editingId = null;
    let closingId = null;

    // ---- token ----
    const TOKEN_KEY = 'mg_gh_token';
    const getToken = () => localStorage.getItem(TOKEN_KEY) || '';

    // ---- toast ----
    let toastTimer;
    function toast(msg, ms = 3000) {
      const t = $('toast');
      t.textContent = msg;
      t.style.display = 'block';
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => { t.style.display = 'none'; }, ms);
    }

    // ---- modal helpers ----
    function openModal(id) { $(id).classList.add('show'); }
    function closeModals() { document.querySelectorAll('.modal-mask').forEach((m) => m.classList.remove('show')); }
    document.querySelectorAll('[data-close]').forEach((b) => b.addEventListener('click', closeModals));
    document.querySelectorAll('.modal-mask').forEach((m) => m.addEventListener('click', (e) => { if (e.target === m) closeModals(); }));

    // ---- api ----
    async function api(method, body) {
      const headers = { 'Content-Type': 'application/json' };
      const tok = getToken();
      if (tok) headers['X-GH-Token'] = tok;
      const res = await fetch('/api/trades', { method, headers, body: body ? JSON.stringify(body) : undefined });
      const data = await res.json().catch(() => ({}));
      if (!res.ok) {
        if (data.needToken) { openModal('mToken'); }
        throw new Error(data.error || `HTTP ${res.status}`);
      }
      return data;
    }

    // ---- render ----
    function tradeCard(t) {
      const isClosed = t.status === 'closed';
      const pnlHtml = isClosed
        ? `<div class="t-pnl">
             <div class="p ${cls(t.pnl)}">${signed(t.pnl)}</div>
             <div class="pp ${cls(t.pnlPct)}">${signed(t.pnlPct)}%</div>
           </div>`
        : `<div class="t-pnl"><div class="pp flat">持仓中</div></div>`;
      const actions = `
        <div class="t-actions">
          ${isClosed ? '' : `<button class="btn small primary" data-act="close" data-id="${esc(t.id)}">✅ 平仓</button>`}
          <button class="btn small" data-act="edit" data-id="${esc(t.id)}">✏️ 编辑</button>
          <button class="btn small danger" data-act="del" data-id="${esc(t.id)}">🗑 删除</button>
        </div>`;
      return `
        <div class="trade">
          <div class="t-top">
            <span class="t-sym mono">${esc(t.symbol) || '--'}</span>
            <span class="t-name">${esc(t.name)}</span>
            <span class="t-dir ${t.direction}">${t.direction === 'short' ? '做空 SHORT' : '做多 LONG'}</span>
            ${pnlHtml}
          </div>
          <div class="t-grid">
            <span><span class="lbl">开仓</span> <span class="val">${esc(t.openDate) || '--'} @ ${fmtNum(t.openPrice)}</span></span>
            ${isClosed
              ? `<span><span class="lbl">平仓</span> <span class="val">${esc(t.closeDate) || '--'} @ ${fmtNum(t.closePrice)}</span></span>`
              : ''}
            ${t.size ? `<span><span class="lbl">仓位</span> <span class="val">${esc(t.size)}</span></span>` : ''}
            <span><span class="lbl">编号</span> <span class="val">${esc(t.id)}</span></span>
          </div>
          ${t.note ? `<div class="t-note">${esc(t.note)}</div>` : ''}
          ${actions}
        </div>`;
    }

    function render(data) {
      const el = $('content');
      const trades = Array.isArray(data.trades) ? data.trades : [];
      TRADES = trades;
      const open = trades.filter((t) => t.status === 'open');
      const closed = trades.filter((t) => t.status === 'closed');

      const s = data.stats || {};
      const wins = s.wins ?? closed.filter((t) => (t.pnl ?? 0) > 0).length;
      const losses = s.losses ?? closed.filter((t) => (t.pnl ?? 0) < 0).length;
      const total = s.total ?? trades.length;
      const winRate = s.winRate ?? (closed.length ? (wins / closed.length) * 100 : null);
      const totalPnl = s.totalPnl ?? (closed.length ? closed.reduce((a, t) => a + (t.pnl || 0), 0) : null);

      let html = `
        <div class="stats">
          <div class="stat"><div class="v">${total}</div><div class="k">总笔数</div></div>
          <div class="stat"><div class="v up">${wins}</div><div class="k">胜</div></div>
          <div class="stat"><div class="v down">${losses}</div><div class="k">负</div></div>
          <div class="stat"><div class="v ${winRate === null ? 'flat' : winRate >= 50 ? 'up' : 'down'}">${winRate === null ? '--' : fmtNum(winRate, 1) + '%'}</div><div class="k">胜率</div></div>
          <div class="stat"><div class="v ${cls(totalPnl)}">${totalPnl === null ? '--' : signed(totalPnl)}</div><div class="k">累计盈亏</div></div>
        </div>`;

      if (!trades.length) {
        html += `<div class="empty">暂无交易记录 · 点上方「➕ 记一笔」开始</div>`;
      } else {
        if (open.length) {
          html += `<h2>🟢 持仓中 <span class="cnt">${open.length} 笔</span></h2>`;
          html += open.map(tradeCard).join('');
        }
        if (closed.length) {
          html += `<h2>✅ 已平仓 <span class="cnt">${closed.length} 笔</span></h2>`;
          html += closed.slice().sort((a, b) => String(b.closeDate || '').localeCompare(String(a.closeDate || ''))).map(tradeCard).join('');
        }
      }

      el.className = '';
      el.innerHTML = html;
    }

    async function load() {
      const el = $('content');
      try {
        // /api/trades 直读 GitHub 最新，绕过 Pages 部署延迟；失败回退静态文件
        let data;
        try {
          data = await api('GET');
          if (data.error) throw new Error(data.error);
        } catch {
          const res = await fetch('trades.json?t=' + Date.now());
          data = await res.json();
        }
        render(data);
      } catch {
        el.className = 'empty';
        el.textContent = '加载失败，请刷新重试';
      }
    }

    // ---- add / edit ----
    const today = () => new Date(Date.now() + 8 * 3600 * 1000).toISOString().slice(0, 10);

    $('btnAdd').addEventListener('click', () => {
      editingId = null;
      $('mTradeTitle').textContent = '➕ 记一笔';
      $('fSymbol').value = ''; $('fName').value = ''; $('fDirection').value = 'long';
      $('fOpenDate').value = today(); $('fOpenPrice').value = ''; $('fSize').value = ''; $('fNote').value = '';
      openModal('mTrade');
    });

    function startEdit(t) {
      editingId = t.id;
      $('mTradeTitle').textContent = `✏️ 编辑 ${t.id}`;
      $('fSymbol').value = t.symbol || ''; $('fName').value = t.name || '';
      $('fDirection').value = t.direction || 'long';
      $('fOpenDate').value = t.openDate || ''; $('fOpenPrice').value = t.openPrice ?? '';
      $('fSize').value = t.size || ''; $('fNote').value = t.note || '';
      openModal('mTrade');
    }

    $('fSubmit').addEventListener('click', async () => {
      const symbol = $('fSymbol').value.trim();
      if (!symbol) { toast('标的代码必填'); return; }
      const fields = {
        symbol, name: $('fName').value.trim(), direction: $('fDirection').value,
        openDate: $('fOpenDate').value, openPrice: $('fOpenPrice').value,
        size: $('fSize').value.trim(), note: $('fNote').value.trim(),
      };
      $('fSubmit').disabled = true;
      try {
        if (editingId) {
          const data = await api('POST', { action: 'edit', id: editingId, fields });
          render(data.data); toast('✏️ 已保存');
        } else {
          const data = await api('POST', { action: 'add', trade: fields });
          render(data.data); toast('➕ 已记录');
        }
        closeModals();
      } catch (e) { toast('失败：' + e.message, 5000); }
      $('fSubmit').disabled = false;
    });

    // ---- close ----
    function startClose(t) {
      closingId = t.id;
      $('cInfo').textContent = `${t.symbol} ${t.name || ''} · ${t.direction === 'short' ? '做空' : '做多'} · 开仓 ${t.openDate} @ ${fmtNum(t.openPrice)}`;
      $('cDate').value = today(); $('cPrice').value = '';
      openModal('mClose');
    }

    $('cSubmit').addEventListener('click', async () => {
      const price = $('cPrice').value;
      if (price === '') { toast('平仓价必填'); return; }
      $('cSubmit').disabled = true;
      try {
        const data = await api('POST', { action: 'close', id: closingId, closeDate: $('cDate').value, closePrice: price });
        render(data.data); closeModals(); toast('✅ 已平仓');
      } catch (e) { toast('失败：' + e.message, 5000); }
      $('cSubmit').disabled = false;
    });

    // ---- delete / card actions ----
    $('content').addEventListener('click', async (e) => {
      const btn = e.target.closest('[data-act]');
      if (!btn) return;
      const t = TRADES.find((x) => x.id === btn.dataset.id);
      if (!t) return;
      const act = btn.dataset.act;
      if (act === 'edit') startEdit(t);
      else if (act === 'close') startClose(t);
      else if (act === 'del') {
        if (!confirm(`确认删除 ${t.symbol}（${t.id}）？此操作会从战绩中永久移除。`)) return;
        btn.disabled = true;
        try {
          const data = await api('POST', { action: 'delete', id: t.id });
          render(data.data); toast('🗑 已删除');
        } catch (err) { toast('失败：' + err.message, 5000); btn.disabled = false; }
      }
    });

    // ---- upload ----
    $('btnUpload').addEventListener('click', () => $('fileInput').click());

    function compressImage(file, maxBytes) {
      return new Promise((resolve, reject) => {
        if (file.size <= maxBytes && !/heic/i.test(file.type)) { resolve(file); return; }
        const img = new Image();
        const url = URL.createObjectURL(file);
        img.onload = () => {
          URL.revokeObjectURL(url);
          const scale = Math.min(1, 2000 / Math.max(img.width, img.height));
          const canvas = document.createElement('canvas');
          canvas.width = Math.round(img.width * scale);
          canvas.height = Math.round(img.height * scale);
          canvas.getContext('2d').drawImage(img, 0, 0, canvas.width, canvas.height);
          canvas.toBlob((blob) => {
            if (!blob) { reject(new Error('压缩失败')); return; }
            if (blob.size > maxBytes) { reject(new Error('图片太大，压缩后仍超 4MB')); return; }
            resolve(new File([blob], (file.name || 'shot').replace(/\.\w+$/, '') + '.jpg', { type: 'image/jpeg' }));
          }, 'image/jpeg', 0.82);
        };
        img.onerror = () => { URL.revokeObjectURL(url); reject(new Error('图片读取失败')); };
        img.src = url;
      });
    }

    $('fileInput').addEventListener('change', async (e) => {
      const file = e.target.files[0];
      e.target.value = '';
      if (!file) return;
      toast('📷 上传中…', 60000);
      try {
        const upFile = await compressImage(file, 4 * 1024 * 1024);
        const form = new FormData();
        form.append('file', upFile);
        const headers = {};
        const tok = getToken();
        if (tok) headers['X-GH-Token'] = tok;
        const res = await fetch('/api/upload', { method: 'POST', headers, body: form });
        const data = await res.json().catch(() => ({}));
        if (!res.ok) {
          if (data.needToken) openModal('mToken');
          throw new Error(data.error || `HTTP ${res.status}`);
        }
        toast('✅ 已上传，miniGG 识别后自动入账（通常30分钟内）', 6000);
      } catch (err) {
        toast('上传失败：' + err.message, 6000);
      }
    });

    // ---- token modal ----
    $('btnToken').addEventListener('click', () => {
      $('tokInput').value = getToken();
      openModal('mToken');
    });
    $('tokSave').addEventListener('click', () => {
      const v = $('tokInput').value.trim();
      if (v) localStorage.setItem(TOKEN_KEY, v); else localStorage.removeItem(TOKEN_KEY);
      closeModals(); toast(v ? '⚙️ Token 已保存到本浏览器' : 'Token 已清空');
    });
    $('tokClear').addEventListener('click', () => {
      localStorage.removeItem(TOKEN_KEY);
      $('tokInput').value = '';
      toast('Token 已清除');
    });

    load();
  </script>
</body>
</html>
