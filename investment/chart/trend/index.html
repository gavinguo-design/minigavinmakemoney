<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>趋势看板 · miniGG</title>
<link rel="icon" href="/favicon-32.png">
<script src="../vendor/lightweight-charts-4.2.0.min.js"></script>
<script src="trend-rules.js?v=1"></script>
<style>
*{box-sizing:border-box}body{margin:0;background:#080c10;color:#e2e8f0;font:14px/1.55 system-ui,-apple-system,"PingFang SC",sans-serif}
a{color:#a5c8ff;text-decoration:none}a:hover{text-decoration:underline}
header{border-bottom:1px solid #263141;padding:12px 20px;display:flex;gap:16px;align-items:center}header nav{margin-left:auto;display:flex;gap:14px;font-size:13px}
.wrap{max-width:1280px;margin:auto;padding:16px 16px 30px}
.verdict{background:linear-gradient(90deg,#14202e,#0e151e);border:1px solid #2c3c52;border-radius:12px;padding:14px 18px;display:flex;flex-wrap:wrap;gap:8px 18px;align-items:center}
.verdict b{font-size:19px;letter-spacing:.3px}.verdict .meta{margin-left:auto;color:#9aaabc;font-size:12px;text-align:right}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:12px}
.card{background:#0e151e;border:1px solid #263141;border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:8px;min-width:0}
.card h3{margin:0;font-size:15px;display:flex;align-items:center;gap:8px}.card h3 small{color:#9aaabc;font-weight:400;font-size:12px}
.badge{font-size:12px;padding:2px 9px;border-radius:999px;font-weight:600;cursor:help}
.b-up{background:#ff4d6a22;color:#ff7d93;border:1px solid #ff4d6a66}.b-down{background:#1fc77e22;color:#4fe0a0;border:1px solid #1fc77e66}
.b-pullback{background:#eabd5522;color:#f0cc72;border:1px solid #eabd5566}.b-range{background:#6b7c9322;color:#b7c4d6;border:1px solid #6b7c9366}.b-unknown{background:#333;color:#aaa}
.price{font:700 24px/1.2 ui-monospace,SFMono-Regular,monospace;display:flex;align-items:baseline;gap:10px}.price span{font-size:13px;font-weight:500}
.r{color:#ff6b81}.g{color:#3ddc97}.mut{color:#9aaabc;font-size:12px}
.mas{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}.mas div{background:#080c10;border-radius:7px;padding:5px 8px;font-size:12px}.mas b{display:block;font:600 13px ui-monospace,monospace}
.lv{display:grid;grid-template-columns:1fr 1fr;gap:6px;font-size:12px}.lv div{background:#080c10;border-radius:7px;padding:6px 8px}.lv .t{color:#9aaabc}
.lv .item{font-family:ui-monospace,monospace}
.todo{border-left:3px solid #6aa7ff;background:#6aa7ff10;padding:8px 10px;border-radius:0 8px 8px 0}
.todo .now{font-weight:600;font-size:14px}.todo p{margin:4px 0 0;font-size:12.5px}.todo p em{font-style:normal;color:#9aaabc;margin-right:4px}
.mini{height:170px;border-radius:8px;overflow:hidden}
.legend{font-size:11px;color:#9aaabc;display:flex;gap:10px}.legend i{display:inline-block;width:10px;height:2px;vertical-align:middle;margin-right:3px}
.vix{margin-top:12px;background:#0e151e;border:1px solid #263141;border-radius:12px;padding:12px 16px;display:flex;flex-wrap:wrap;align-items:center;gap:10px 18px}
.vbar{flex:1;min-width:260px;display:grid;grid-template-columns:15fr 5fr 10fr 10fr;height:10px;border-radius:6px;overflow:visible;position:relative}
.vbar span{height:10px}.vbar span:nth-child(1){background:#2e7d5b;border-radius:6px 0 0 6px}.vbar span:nth-child(2){background:#5f7f3a}.vbar span:nth-child(3){background:#b98a2e}.vbar span:nth-child(4){background:#b23b4f;border-radius:0 6px 6px 0}
.vmark{position:absolute;top:-5px;width:3px;height:20px;background:#fff;border-radius:2px;box-shadow:0 0 6px #fff}
.vlabels{display:grid;grid-template-columns:15fr 5fr 10fr 10fr;font-size:11px;color:#9aaabc;margin-top:4px}
.note{margin-top:10px;font-size:12px;color:#9aaabc}
footer{margin-top:14px;color:#7d8da1;font-size:12px;border-top:1px solid #263141;padding-top:10px}
.err{color:#ff879d;font-size:12px}
[data-tip]{position:relative}[data-tip]:hover::after{content:attr(data-tip);position:absolute;left:0;top:120%;z-index:5;background:#1b2735;border:1px solid #3a4d66;color:#e2e8f0;padding:7px 9px;border-radius:7px;font-size:12px;font-weight:400;width:max-content;max-width:280px;white-space:normal;line-height:1.5}
@media(max-width:980px){.grid{grid-template-columns:1fr}.verdict .meta{margin-left:0;text-align:left}}
</style>
</head>
<body>
<header><b>miniGG · 趋势看板</b><nav><a href="../">恒指走势分析</a><a href="../track/">预测成绩</a></nav></header>
<main class="wrap">
  <section class="verdict"><b id="verdict">正在读取行情…</b><div class="meta"><div id="updated">—</div><div id="asof">—</div></div></section>
  <section class="grid" id="cards"></section>
  <section class="vix" id="vix"><b>VIX 情绪</b><span class="mut">读取中…</span></section>
  <p class="note" id="cbbc"></p>
  <footer>基于均线与关键位的规则判断，未经回测验证，不构成投资建议。<span id="src"></span></footer>
</main>
<script>
(function(){
'use strict';
var R = window.TrendRules;
var MARKETS = [
  { sym: '^HSI',  name: '恒生指数', mk: 'hk', dp: 0, tz: 'Asia/Hong_Kong' },
  { sym: '^GSPC', name: '标普500',  mk: 'us', dp: 2, tz: 'America/New_York' },
  { sym: 'QQQ',   name: '纳指100 (QQQ)', mk: 'us', dp: 2, tz: 'America/New_York' }
];
var UP = '#ff4d6a', DOWN = '#1fc77e'; // 红涨绿跌
var charts = {};

function $(id){ return document.getElementById(id); }
function esc(v){ return String(v==null?'':v).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];}); }
function num(v,dp){ return (typeof v==='number'&&isFinite(v)) ? v.toLocaleString('en-US',{minimumFractionDigits:dp,maximumFractionDigits:dp}) : '—'; }
function sgn(v){ if(!(typeof v==='number'&&isFinite(v))) return '<span>—</span>'; return '<span class="'+(v>=0?'r':'g')+'">'+(v>=0?'+':'')+v.toFixed(2)+'%</span>'; }
function fmtTime(sec, tz){
  if(!sec) return '—';
  return new Intl.DateTimeFormat('zh-CN',{timeZone:tz,month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',hour12:false}).format(new Date(sec*1000));
}
function fetchK(sym){
  return fetch('/api/kline?symbol='+encodeURIComponent(sym)+'&interval=1d&range=2y',{credentials:'same-origin'})
    .then(function(r){ if(!r.ok) throw new Error('HTTP '+r.status); return r.json(); });
}

var TIPS = {
  up: '价格在20/50/200日均线上方，长期趋势向上',
  pullback: '价格仍在200日线上方（长期向上），但短线跌回20日或50日线下方',
  range: '价格与均线方向不一致，或空头趋势中反弹到50日线上方',
  down: '价格在50日与200日线下方，均线向下排列'
};

function cardHtml(cfg, m, d){
  var t = m.trend, a = m.advice, dp = cfg.dp;
  function lvList(arr){ return arr.length ? arr.map(function(x){ return '<div class="item">'+esc(x.name)+' '+num(x.v,dp)+'</div>'; }).join('') : '<div class="item">—</div>'; }
  return '<h3>'+esc(cfg.name)+' <span class="badge b-'+t.state+'" data-tip="'+esc(t.why+'。'+(TIPS[t.state]||''))+'">'+esc(t.label)+'</span><small>'+esc(cfg.sym)+'</small></h3>'+
    '<div class="price">'+num(m.price,dp)+' <span class="mut">5日</span>'+sgn(m.chg5)+'</div>'+
    '<div class="mas"><div data-tip="20日均线 '+num(m.ma20,dp)+'">距MA20<b>'+sgn(m.d20)+'</b></div><div data-tip="50日均线 '+num(m.ma50,dp)+'">距MA50<b>'+sgn(m.d50)+'</b></div><div data-tip="200日均线 '+num(m.ma200,dp)+'">距MA200<b>'+sgn(m.d200)+'</b></div></div>'+
    '<div class="lv"><div><div class="t">上方阻力</div>'+lvList(m.levels.resistance)+'</div><div><div class="t">下方支撑</div>'+lvList(m.levels.support)+'</div></div>'+
    '<div class="todo"><div class="now">现在怎么做：'+esc(a.now)+'</div><p><em>触发</em>'+esc(a.trigger)+'</p><p><em>失效</em>'+esc(a.invalid)+'</p></div>'+
    '<div class="legend"><span><i style="background:#f0cc72"></i>MA20</span><span><i style="background:#6aa7ff"></i>MA50</span><span><i style="background:#c58cff"></i>MA200</span><span class="mut">近120日 · 数据截至 '+esc(fmtTime(d.regularMarketTime,cfg.tz))+'</span></div>'+
    '<div class="mini" id="mini-'+cfg.mk+'-'+cfg.sym.replace(/\W/g,'')+'"></div>';
}

function drawMini(el, bars, m){
  if(!window.LightweightCharts) return;
  var key = el.id; if(charts[key]){ try{charts[key].remove();}catch(e){} }
  var chart = LightweightCharts.createChart(el,{
    height:170, layout:{background:{color:'#080c10'},textColor:'#7d8da1',fontSize:10},
    grid:{vertLines:{visible:false},horzLines:{color:'#151d28'}},
    rightPriceScale:{borderVisible:false}, timeScale:{borderVisible:false,timeVisible:false},
    handleScroll:false, handleScale:false, crosshair:{mode:0}
  });
  charts[key]=chart;
  var start = Math.max(0, bars.length-120);
  var cs = chart.addCandlestickSeries({upColor:UP,downColor:DOWN,borderUpColor:UP,borderDownColor:DOWN,wickUpColor:UP,wickDownColor:DOWN,priceLineVisible:false});
  cs.setData(bars.slice(start).map(function(b){ return {time:b.t,open:b.o,high:b.h,low:b.l,close:b.c}; }));
  [['ma20','#f0cc72'],['ma50','#6aa7ff'],['ma200','#c58cff']].forEach(function(p){
    var s = chart.addLineSeries({color:p[1],lineWidth:1,priceLineVisible:false,lastValueVisible:false,crosshairMarkerVisible:false});
    var arr=[]; for(var i=start;i<bars.length;i++){ var v=m.series[p[0]][i]; if(v!=null) arr.push({time:bars[i].t,value:v}); }
    s.setData(arr);
  });
  if(m.priorLow){ cs.createPriceLine({price:m.priorLow,color:'#9aaabc',lineWidth:1,lineStyle:2,axisLabelVisible:true,title:'月线前低'}); }
  chart.timeScale().fitContent();
  new ResizeObserver(function(){ chart.applyOptions({width:el.clientWidth}); }).observe(el);
}

function renderVix(d){
  var box = $('vix');
  if(!d){ box.innerHTML='<b>VIX 情绪</b><span class="err">暂未取到 VIX 数据</span>'; return null; }
  var bars = R.cleanBars(d), v = bars.length ? bars[bars.length-1].c : d.regularMarketPrice;
  var lv = R.vixLevel(v), pos = Math.max(0, Math.min(40, v)) / 40 * 100;
  box.innerHTML = '<b>VIX 情绪</b><span class="price" style="font-size:20px">'+num(v,2)+'</span>'+
    '<span class="badge b-'+({low:'down',normal:'range',tense:'pullback',panic:'up'}[lv.state]||'unknown')+'" data-tip="VIX 低于15为低，15-20正常，20-30紧张，30以上恐慌">'+esc(lv.label)+'</span><span class="mut">'+esc(lv.desc||'')+'</span>'+
    '<div style="flex:1;min-width:260px"><div class="vbar"><span></span><span></span><span></span><span></span><i class="vmark" style="left:calc('+pos.toFixed(1)+'% - 1px)"></i></div><div class="vlabels"><span>低 &lt;15</span><span>正常</span><span>紧张 20-30</span><span>恐慌 &gt;30</span></div></div>';
  return d;
}

function load(){
  var jobs = MARKETS.map(function(c){ return fetchK(c.sym).then(function(d){return {c:c,d:d};},function(e){return {c:c,err:e};}); });
  jobs.push(fetchK('^VIX').then(function(d){return d;},function(){return null;}));
  Promise.all(jobs).then(function(res){
    var vixD = res.pop();
    var cardsEl = $('cards'); cardsEl.innerHTML='';
    var states = {}, asof = [];
    res.forEach(function(r){
      var card = document.createElement('article'); card.className='card'; cardsEl.appendChild(card);
      if(r.err){ card.innerHTML='<h3>'+esc(r.c.name)+'</h3><div class="err">行情读取失败（'+esc(r.err.message)+'），稍后自动重试</div>'; states[r.c.sym]='unknown'; return; }
      var bars = R.cleanBars(r.d), m = R.analyze(bars,{market:r.c.mk});
      if(!m){ card.innerHTML='<h3>'+esc(r.c.name)+'</h3><div class="err">数据不足</div>'; states[r.c.sym]='unknown'; return; }
      states[r.c.sym]=m.trend.state;
      card.innerHTML = cardHtml(r.c,m,r.d);
      drawMini(card.querySelector('.mini'), bars, m);
      asof.push((r.c.mk==='hk'?'港股 ':'美股 ')+fmtTime(r.d.regularMarketTime, r.c.tz)+(r.c.mk==='hk'?' (香港时间)':' (美东时间)'));
    });
    renderVix(vixD);
    $('verdict').textContent = R.summarize(states['^HSI'], R.combineUS(states['^GSPC'], states['QQQ']));
    var now = new Date();
    $('updated').textContent = '页面更新 '+now.toLocaleString('zh-CN',{hour12:false,timeZone:'Asia/Shanghai'});
    $('asof').textContent = '数据截至：'+ (asof.filter(function(x,i,a){return a.indexOf(x)===i;}).join(' · ')||'—');
    $('src').textContent = ' 数据来源：Yahoo Finance 日线（经本站 /api/kline 代理，约5分钟缓存）· 抓取时间 '+now.toLocaleString('zh-CN',{hour12:false,timeZone:'Asia/Shanghai'})+'。';
  });
}

// 交易时段（港股 09:30-16:10 HKT，美股 09:30-16:00 ET，工作日）每5分钟自动刷新
function inSession(){
  var now = new Date();
  function part(tz){
    var p = new Intl.DateTimeFormat('en-US',{timeZone:tz,weekday:'short',hour:'2-digit',minute:'2-digit',hour12:false}).formatToParts(now);
    var o={}; p.forEach(function(x){o[x.type]=x.value;}); return {wd:o.weekday, m:(+o.hour%24)*60+(+o.minute)};
  }
  var hk = part('Asia/Hong_Kong'), us = part('America/New_York');
  var wk = function(w){ return w!=='Sat'&&w!=='Sun'; };
  return (wk(hk.wd) && hk.m>=570 && hk.m<=970) || (wk(us.wd) && us.m>=570 && us.m<=965);
}
$('cbbc').textContent = '工具提示：' + R.CBBC_NOTE;
load();
setInterval(function(){ if(inSession() && !document.hidden) load(); }, 5*60*1000);
})();
</script>
</body>
</html>
