<!DOCTYPE html>
<html lang="zh" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>登录 · minigavin</title>
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet" />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    :root {
      --bg: #0D0D0F;
      --card: #1C1C1E;
      --border: rgba(255,255,255,0.08);
      --up: #FF453A;
      --down: #32D74B;
      --gold: #f5c842;
      --accent: #0A84FF;
      --text: #F5F5F7;
      --muted: rgba(235,235,245,0.5);
    }
    html, body { background: var(--bg); color: var(--text); font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "PingFang SC", 'Inter', system-ui, sans-serif; min-height: 100vh; }
    body { display: flex; align-items: center; justify-content: center; padding: 20px; }
    .box {
      width: 100%; max-width: 360px;
      background: var(--card); border: 1px solid var(--border); border-radius: 20px;
      padding: 32px 28px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.4);
    }
    .brand { display: flex; align-items: center; gap: 10px; margin-bottom: 6px; }
    .logo {
      width: 34px; height: 34px; border-radius: 8px;
      background: none; object-fit: cover;
      display: flex; align-items: center; justify-content: center;
      color: #000; font-size: 15px; font-weight: 900;
    }
    .brand h1 { font-size: 18px; font-weight: 800; letter-spacing: -0.02em; }
    .sub { font-size: 12px; color: var(--muted); margin-bottom: 24px; }
    label { display: block; font-size: 12px; font-weight: 600; color: rgba(235,235,245,0.6); margin: 14px 0 6px; }
    input {
      width: 100%; padding: 11px 12px;
      background: rgba(255,255,255,0.04); border: 1px solid var(--border); border-radius: 10px;
      color: var(--text); font-size: 14px; font-family: inherit;
      outline: none; transition: border-color .15s;
    }
    input { min-height: 44px; }
    input:focus { border-color: var(--accent); background: rgba(10,132,255,0.06); }
    button {
      width: 100%; margin-top: 22px; padding: 13px; min-height: 44px;
      background: var(--accent);
      border: none; border-radius: 12px;
      color: #fff; font-size: 15px; font-weight: 700; font-family: inherit;
      cursor: pointer; transition: opacity 0.2s ease;
    }
    button:hover { opacity: 0.88; }
    button:disabled { opacity: 0.5; cursor: not-allowed; }
    .err {
      display: none; margin-top: 14px; padding: 9px 12px;
      background: rgba(255,69,58,0.12); border: 1px solid rgba(255,69,58,0.35); border-radius: 10px;
      color: #FF453A; font-size: 12.5px; font-weight: 600;
    }
  </style>
</head>
<body>
  <form class="box" id="loginForm">
    <div class="brand">
      <img class="logo" src="/icon-192.png" alt="minigavin">
      <h1>minigavin · 投资雷达</h1>
    </div>
    <p class="sub">私有站点，请登录后访问</p>
    <label for="username">账号</label>
    <input id="username" name="username" type="text" autocomplete="username" autocapitalize="none" autofocus required />
    <label for="password">密码</label>
    <input id="password" name="password" type="password" autocomplete="current-password" required />
    <button type="submit" id="btn">登 录</button>
    <div class="err" id="err">账号或密码错误</div>
  </form>

  <script>
    const form = document.getElementById('loginForm');
    const btn = document.getElementById('btn');
    const err = document.getElementById('err');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      err.style.display = 'none';
      btn.disabled = true;
      btn.textContent = '登录中…';
      try {
        const res = await fetch('/api/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            username: document.getElementById('username').value.trim(),
            password: document.getElementById('password').value,
          }),
        });
        const data = await res.json().catch(() => ({}));
        if (res.ok && data.ok) {
          const params = new URLSearchParams(location.search);
          let redirect = params.get('redirect') || '/';
          // only allow same-site relative redirects
          if (!redirect.startsWith('/') || redirect.startsWith('//')) redirect = '/';
          location.href = redirect;
          return;
        }
        err.textContent = res.status === 401 ? '账号或密码错误' : '登录失败，请重试';
        err.style.display = 'block';
      } catch {
        err.textContent = '网络错误，请重试';
        err.style.display = 'block';
      }
      btn.disabled = false;
      btn.textContent = '登 录';
    });
  </script>
</body>
</html>
